name: Supabase Keep Alive

"on":
  schedule:
    # Corre cada 3 días a las 09:00 UTC
    - cron: "0 9 */3 * *"
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      # Lee una fila real de una tabla (configuracion_tienda es pública por RLS):
      # así la consulta llega a Postgres y cuenta como actividad. La raíz
      # /rest/v1/ solo devuelve el esquema de la API.
      - name: Consultar una tabla de Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/configuracion_tienda?select=nombre_tienda&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Respuesta HTTP: $response"
          if [ "$response" -eq 200 ]; then
            echo "Consulta exitosa (base activa)."
          else
            echo "Error: respuesta inesperada ($response)."
            exit 1
          fi
